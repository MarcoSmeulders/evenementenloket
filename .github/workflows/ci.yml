# Fast checks on every push and pull request (ADR-0002).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    # Pinned: ubuntu-latest moves to 26.04 in Oct-Nov 2026 (actions/runner-images#14748).
    # Keep it equal to the runner in e2e.yml. Removing the pin: https://github.com/MarcoSmeulders/evenementenloket/issues/1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the secret scan checks every commit, because anything ever
          # committed to a public repository counts as leaked.
          fetch-depth: 0

      # Scans the whole history, not only the pushed commits. Dependabot does not update
      # this image: bump the version by hand now and then.
      - name: Secret scan
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE":/repo:ro
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @evenementenloket/web build-storybook
