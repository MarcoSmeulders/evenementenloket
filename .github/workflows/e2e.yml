# Browser tests: on every push to develop, on every pull request to main, and by hand
# (ADR-0002, ADR-0007).
name: E2E

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    # Pinned: the WebKit build of Playwright 1.63 needs libicu 74, which Ubuntu 26.04 no
    # longer has, and ubuntu-latest moves to 26.04 in Oct-Nov 2026
    # (actions/runner-images#14748). Remove the pin once `pnpm test:e2e` passes on 26.04:
    # https://github.com/MarcoSmeulders/evenementenloket/issues/3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browsers depend on the OS version, so the cache key holds both. ImageOS is set by
      # the runner (for example "ubuntu24").
      - name: Read Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
